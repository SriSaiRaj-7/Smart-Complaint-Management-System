<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Smart Complaint Management{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('dashboard') }}">Smart Complaint Management</a>
    <nav aria-label="Main navigation">
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <a href="/raise">Raise</a>
      <a href="/search">Search</a>
      <a href="/escalation">Escalation</a>
      <a href="/stats">Stats</a>
    </nav>
  </header>
  <main class="page">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="messages" role="status">
          {% for category, message in messages %}
            <p class="flash flash-{{ category }}">{{ message }}</p>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
